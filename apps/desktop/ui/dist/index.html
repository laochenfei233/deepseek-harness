<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DeepSeek Harness</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="shell">
  <header class="nav-bar">
    <div class="nav-left">
      <button id="btn-sidebar" class="nav-btn" title="切换侧边栏" aria-label="切换侧边栏">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
      </button>
      <button id="btn-back" class="nav-btn" title="后退" aria-label="后退" disabled>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6" />
        </svg>
      </button>
      <button id="btn-forward" class="nav-btn" title="前进" aria-label="前进" disabled>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6" />
        </svg>
      </button>
    </div>
    <div class="nav-title">DeepSeek Harness</div>
    <div class="nav-right">
      <span id="status-dot" class="status-dot" title="连接状态"></span>
      <span id="status-text" class="status-text">启动中…</span>
    </div>
  </header>
  <div id="error-banner" class="error-banner hidden">
    <span id="error-text"></span>
    <button id="btn-retry" class="btn">重启服务</button>
  </div>
  <main class="frame-host">
    <iframe id="dsh-frame" title="DeepSeek Harness" src="about:blank"></iframe>
  </main>
  <script src="app.js"></script>
</body>
</html>
