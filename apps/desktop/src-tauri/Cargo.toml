[package]
name = "dsh-desktop"
version = "0.1.0"
description = "DeepSeek Harness desktop shell (Tauri 2)"
authors = ["dsh-desktop contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "dsh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["process", "time", "sync", "rt-multi-thread", "macros", "io-util", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[features]
# This feature is used for production builds or when a dev server is not
# specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
