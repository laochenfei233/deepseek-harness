name: desktop-release

# Builds the Tauri desktop shell for Windows, macOS and Linux, bundles the
# per-platform Node runtime + dsh closure (scripts/bundle-runtime.mjs) and
# uploads the installers to a GitHub Release.
#
# Trigger: manual dispatch, or pushing a tag `v*` (the tauri-action creates
# or updates the Release for that tag).

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_HTTP_CHECK_REVOKE: 'false'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            runtime-platform: win
          - platform: macos-latest
            runtime-platform: mac
          - platform: ubuntu-latest
            runtime-platform: linux
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build repository artifacts (lib + web dist)
        run: pnpm run build

      - name: Bundle Node runtime + dsh closure
        working-directory: apps/desktop
        run: node scripts/bundle-runtime.mjs --platform ${{ matrix.runtime-platform }}

      - name: Build Tauri app and upload to Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: v__VERSION__
          releaseName: 'DeepSeek Harness Desktop v__VERSION__'
          releaseBody: |
            Tauri 桌面客户端，内置 Node 运行时与 dsh（四预设 standard / minimal / code / cordis 完整保留）。
            首次启动向导默认安装插件市场与 Windows 终端检测，可选 IM 频道（企微/飞书/钉钉/微信/QQ）等插件。
          releaseDraft: true
          prerelease: false
